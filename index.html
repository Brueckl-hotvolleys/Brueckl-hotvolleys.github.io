  <style type="text/css">
html, body, * {
  margin: 0;
  padding: 0;
  border: 0 none;
  overflow: hidden;

}
div.imgs {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: url("bhv2.gif");

  background-size: contain;
}
img {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;

}

@keyframes showandhide {
  0% { opacity: 0; }
  10% { opacity: 1; }
  50% { opacity: 1; }
  60% { opacity: 0; }
}

img#img2 {
  opacity: 0;
  animation: 15s infinite showandhide;
}

 </head>
 <body>
